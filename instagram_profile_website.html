<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Profile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: radial-gradient(circle at top left, #49306d, #171321 55%, #09090d);
    }
    .card {
      width: min(100%, 380px);
      padding: 34px 26px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 24px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .icon {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      font-size: 40px;
    }
    h1 { margin: 0 0 10px; font-size: 27px; }
    p { margin: 0 0 24px; color: #d5d1df; line-height: 1.5; }
    .button {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(100deg, #d62976, #962fbf, #4f5bd5);
      transition: transform .2s, filter .2s;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .handle { margin-top: 18px; font-size: 14px; color: #c6bfd2; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">◎</div>
    <h1>Instagram Profile</h1>
    <p>Visit the Instagram profile below.</p>
    <a class="button" href="https://www.instagram.com/__ishu.exe/" target="_blank" rel="noopener noreferrer">
      Open Instagram
    </a>
    <div class="handle">@__ishu.exe</div>
  </main>
</body>
</html>
